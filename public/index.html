<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F6F3ED">
  <title>JTG Audio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%23D97757'/%3E%3Cpath d='M13 9v14l10-7z' fill='%23FAF5ED'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="wrap">
    <main class="library" aria-labelledby="list-title">
      <div class="section-head">
        <div class="library-heading">
          <h1 id="list-title">我的音频</h1>
          <p class="library-summary"><span><span id="episode-count">0</span> 段音频</span><span class="summary-divider" aria-hidden="true">·</span><span id="storage-total">0 B</span></p>
        </div>
        <button class="primary add-button" type="button" data-open-upload><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#plus"/></svg>添加音频</button>
      </div>
      <p id="list-error" class="status error" role="alert"></p>
      <div id="empty" class="empty" hidden>
        <div class="empty-disc" aria-hidden="true"><span><svg class="icon"><use href="/assets/icons.svg#audio"/></svg></span></div>
        <h3>还没有音频</h3>
        <p>添加音频后，就可以开始收听。</p>
        <button class="primary" type="button" data-open-upload>添加第一段音频<svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#arrow-right"/></svg></button>
      </div>
      <ul id="episode-list" class="list"></ul>
      <div class="library-tools"><p class="library-note">听完可删除，释放云端空间。</p><button id="logout-button" class="logout-button" type="button" hidden>退出登录</button></div>
    </main>
    <section id="player" class="player" aria-label="音频播放器" hidden>
      <div class="player-top">
        <div class="player-info"><span id="play-state" class="sr-only">准备收听</span><p id="now-title" class="now-title"></p></div>
        <label class="speed-control"><span class="sr-only">播放速度</span><span id="speed-value" aria-hidden="true">1×</span><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#chevron"/></svg><select id="speed" aria-label="播放速度"><option value="1">1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label>
      </div>
      <div class="scrub">
        <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="播放进度" disabled>
        <div class="timestamps"><span id="time-current">0:00</span><span id="time-total">0:00</span></div>
      </div>
      <div class="player-bottom">
        <p id="resume-note" class="sr-only"></p>
        <div class="transport">
          <button id="back-btn" class="skip-button" type="button" aria-label="后退15秒" title="后退 15 秒"><svg class="icon skip-icon" aria-hidden="true"><use href="/assets/icons.svg#skip-back"/></svg></button>
          <button id="play-btn" class="play-button" type="button" aria-label="播放" aria-pressed="false"><svg class="icon play-symbol" aria-hidden="true"><use href="/assets/icons.svg#play"/></svg><svg class="icon pause-symbol" aria-hidden="true"><use href="/assets/icons.svg#pause"/></svg></button>
          <button id="forward-btn" class="skip-button" type="button" aria-label="前进15秒" title="前进 15 秒"><svg class="icon skip-icon" aria-hidden="true"><use href="/assets/icons.svg#skip-forward"/></svg></button>
        </div>
      </div>
      <p id="sync-status" class="status sync-status" role="status"></p>
      <p id="player-error" class="status error" role="status"></p>
    </section>
  </div>

  <dialog id="upload-dialog" aria-labelledby="upload-title">
    <div class="dialog-heading"><h2 id="upload-title">添加音频</h2><button id="close-upload" class="icon-button" type="button" aria-label="关闭上传窗口"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#close"/></svg></button></div>
    <form id="upload-form">
      <input id="file" name="audio" type="file" accept="audio/*,.mp3,.m4a,.mp4,.wav,.ogg,.opus,.aac,.flac,.webm" class="sr-only" aria-label="音频文件">
      <div class="file-field">
        <p class="field-label">音频文件</p>
        <button id="pick-file" class="file-picker" type="button"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#upload"/></svg><span class="file-copy"><strong id="file-name">选择音频文件</strong><span class="file-help"><span>MP3、M4A、WAV 等</span><span>最大 200 MB</span></span></span></button>
      </div>
      <label class="title-label">音频标题 <span>选填</span><input name="title" type="text" maxlength="120" autocomplete="off" placeholder="不填就使用文件名"></label>
      <div class="upload-actions">
        <button id="upload-btn" class="primary submit-button" type="submit">上传音频</button>
        <p id="upload-status" class="status" role="status"></p>
      </div>
    </form>
  </dialog>

  <audio id="audio" preload="metadata" playsinline></audio>
  <noscript><p class="wrap">请开启 JavaScript 后再用。</p></noscript>
  <script src="/progress-sync.js"></script>
  <script src="/session.js"></script>
  <script src="/app.js"></script>
</body>
</html>
