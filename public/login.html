<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F6F3ED">
  <title>登录 · JTG Audio</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">
  <main class="login-card" aria-labelledby="login-title">
    <div class="login-heading">
      <span class="eyebrow">JTG AUDIO</span>
      <h1 id="login-title">登录我的音频</h1>
      <p>输入你的访问密码，继续收听。</p>
    </div>
    <form id="login-form">
      <div>
        <div class="password-label"><label class="field-label" for="password">密码</label><button id="show-password" type="button" aria-label="显示密码" aria-pressed="false">显示</button></div>
        <div class="password-field">
          <input id="password" name="password" type="password" autocomplete="current-password" maxlength="512" required aria-describedby="login-status">
        </div>
      </div>
      <label class="remember-control"><input id="remember" name="remember" type="checkbox" checked><span>记住这台设备 30 天</span></label>
      <div class="login-actions">
        <button id="login-button" class="primary login-button" type="submit">登录</button>
        <p id="login-status" class="status error" role="alert"></p>
      </div>
    </form>
    <p class="login-note">公共设备请取消勾选，使用后退出登录。</p>
    <noscript><p class="status error">请开启 JavaScript 后登录。</p></noscript>
  </main>
  <script src="/login.js"></script>
</body>
</html>
