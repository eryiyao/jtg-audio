server {
    listen 80;
    server_name audio.jimtogrow.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/jtg-audio/acme;
    }
    location / { return 301 https://audio.jimtogrow.com$request_uri; }
}

server {
    listen 443 ssl;
    server_name audio.jimtogrow.com;
    ssl_certificate /etc/letsencrypt/live/audio.jimtogrow.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/audio.jimtogrow.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # The app checks persistent, host-only login cookies on every private route.
    # Includes multipart overhead above the app's 200 MB file limit.
    client_max_body_size 210m;
    client_body_timeout 300s;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location / {
        proxy_pass http://127.0.0.1:4300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
